[project]
name = "chaos-ts"
version = "0.1.0"
description = "Partial multistep prediction with generalized motifs and German load benchmarks"
requires-python = ">=3.12"
dependencies = [
    "imbalanced-learn>=0.14.2",
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "threadpoolctl>=3.6.0",
]

[dependency-groups]
dev = ["ruff>=0.17.4"]

[project.optional-dependencies]
trading = [
    "backtesting>=0.6.5,<0.7",
    "bokeh>=3.8,<4",
    "joblib>=1.5,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
